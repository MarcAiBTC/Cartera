<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <title>Cartera</title>
    <meta name="description" content="Tu cartera de inversión, en cualquier dispositivo" />

    <!-- Pinta el cromo del navegador del color del lienzo en vez de blanco -->
    <meta name="theme-color" content="#f3f1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0c18" media="(prefers-color-scheme: dark)" />

    <!-- Instalable desde un enlace: «Añadir a pantalla de inicio» y arranca a
         pantalla completa. iOS ignora display/icons del manifest y necesita
         estas tres metas aparte, así que van los dos juegos. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cartera" />
    <!-- Sin esquinas redondeadas y sin transparencia: el iPhone aplica su propia
         mascara y pinta de NEGRO lo transparente, asi que un icono ya
         redondeado sale con las cuatro esquinas negras. -->
    <link rel="apple-touch-icon" href="/icono-ios.png?v=2" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- El tema, antes del primer pintado. Si esto viviera en un efecto de
         React se vería un fotograma con el tema equivocado en cada carga. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tema");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          /* almacenamiento bloqueado: se queda el tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
