name: Informe diario por correo

# Un correo por perfil: la cartera de Marc a su dirección y la de Leti a la suya.
# Las posiciones salen de datos/cartera-<perfil>.enc.json, que publica la propia
# app cifrado cada vez que se toca algo; el workflow las descifra con CARTERA_PASS.
#
# El cron de GitHub va en UTC, no ajusta el horario de verano y suele dispararse
# con 30 min – 2 h de retraso. Por eso se programan varios disparos de respaldo y
# el script acepta la franja 22:00–23:59 en Europe/Madrid. Una marca por perfil y
# día (cacheada entre ejecuciones) evita que los respaldos repitan un correo ya
# enviado, sin bloquear el que todavía no salió.
on:
  schedule:
    - cron: '5 20 * * 1-5'    # 22:05 Madrid en verano (CEST)
    - cron: '35 20 * * 1-5'   # respaldo verano
    - cron: '5 21 * * 1-5'    # 22:05 Madrid en invierno (CET) · respaldo verano
    - cron: '35 21 * * 1-5'   # respaldo
    - cron: '5 22 * * 1-5'    # respaldo invierno
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo generar los informes (no enviar correo)'
        type: boolean
        default: false

concurrency: informe-diario

permissions:
  contents: read

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Único paquete que hace falta: el SMTP de Gmail es lo que permite escribir
      # a una dirección que no sea la del dueño de la cuenta de Resend.
      - name: Instalar nodemailer
        run: npm install --no-save --no-audit --no-fund nodemailer@6

      - name: Fecha del día en Madrid
        id: marca
        run: echo "dia=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"

      - name: Recuperar qué informes ya se enviaron hoy
        uses: actions/cache/restore@v4
        with:
          path: .informe-enviado
          key: informe-enviado-${{ steps.marca.outputs.dia }}-
          restore-keys: informe-enviado-${{ steps.marca.outputs.dia }}-

      - name: Generar y enviar los informes
        env:
          # Descifra los ficheros que publica la app
          CARTERA_PASS: ${{ secrets.CARTERA_PASS }}
          # Destinatarios (no van en el código: el repo es público)
          MAIL_MARC: ${{ secrets.MAIL_MARC }}
          MAIL_LETI: ${{ secrets.MAIL_LETI }}
          # Envío por SMTP de Gmail con contraseña de aplicación
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Respaldos: transporte antiguo y posiciones pegadas a mano
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSICIONES_JSON: ${{ secrets.POSICIONES_JSON }}
          # OPCIONAL y de pago. Si existe el secret, el comentario del día lo
          # redacta Claude a partir de los titulares (por qué se ha movido la
          # cartera, no solo cuánto). Sin él se usa el texto de plantilla y no
          # cambia nada más. Al modelo solo se le mandan porcentajes y nombres
          # de subyacente: ni euros, ni saldos, ni cantidades.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Un disparo manual salta el control de la franja horaria
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: node scripts/informe_diario.mjs

      # La clave lleva el run_id porque una clave de caché no se puede
      # sobrescribir: se guarda una nueva y restore-keys coge siempre la última.
      - name: Anotar los informes enviados
        if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .informe-enviado
          key: informe-enviado-${{ steps.marca.outputs.dia }}-${{ github.run_id }}

      # Aquí había un upload-artifact con los informe-*.html. Se quitó a
      # propósito: ese HTML es la cartera YA DESCIFRADA, y en un repositorio
      # público cualquiera puede descargar los artefactos de una ejecución.
      # Subirlo anulaba el cifrado con el que la app publica los datos.
      # Para revisar el HTML, ejecuta el script en tu ordenador:
      #   CARTERA_PASS=... DRY_RUN=1 node scripts/informe_diario.mjs
