# ── PRECIOS CADA 15 MINUTOS ──────────────────────────────────────────────
# El plan Hobby de Vercel SÓLO admite crons diarios: un «*/15» en vercel.json
# hace fallar el despliegue con «Hobby accounts are limited to daily cron
# jobs». Los crons de vercel.json se quedan como red de seguridad diaria y el
# ritmo de verdad lo marca esto, que en GitHub Actions es gratis e ilimitado —
# igual que la Action que ya refrescaba precios.json.
#
# De propina, cada llamada toca la base de datos, así que el proyecto de
# Supabase no se duerme: el plan gratuito pausa los proyectos tras una semana
# sin actividad.
#
# Si algún día pasas a Vercel Pro, borra este archivo y pon el horario real en
# vercel.json:  { "path": "/api/precios", "schedule": "*/15 6-22 * * 1-5" }

name: Precios a Supabase

on:
  schedule:
    # Cada 15 minutos entre las 06:00 y las 22:00 UTC, de lunes a viernes.
    # GitHub no garantiza la puntualidad: con la plataforma cargada puede
    # retrasarse unos minutos, lo cual da igual para un precio de bolsa.
    - cron: "*/15 6-22 * * 1-5"
    # Los fines de semana sólo cripto, que sí cotiza: una vez cada cuatro horas.
    - cron: "0 */4 * * 0,6"
  # Y a mano, desde la pestaña Actions, para probar sin esperar.
  workflow_dispatch:

# Si una ejecución se solapa con la anterior, se cancela la vieja: dos crones
# escribiendo los mismos precios a la vez no aportan nada.
concurrency:
  group: precios-supabase
  cancel-in-progress: true

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a Vercel que actualice los precios
        env:
          URL: ${{ secrets.VERCEL_APP_URL }}
          SECRETO: ${{ secrets.CRON_SECRET }}
        run: |
          # El diagnóstico, primero y sin filtrar nada: este job estuvo
          # fallando en TODAS sus ejecuciones y en la pestaña Actions sólo se
          # veía «failure», así que los precios llevaban un día parados sin
          # que nadie supiera por qué. Decir cuál de los dos secretos falta
          # —sin enseñar su valor— cuesta tres líneas.
          falta=0
          if [ -z "$URL" ]; then
            echo "::error::Falta el secreto VERCEL_APP_URL del repositorio (la dirección de la app, sin barra final: https://tu-app.vercel.app)."
            falta=1
          fi
          if [ -z "$SECRETO" ]; then
            echo "::error::Falta el secreto CRON_SECRET del repositorio. Tiene que ser EL MISMO valor que la variable CRON_SECRET de Vercel."
            falta=1
          fi
          # `if` y no `[ … ] && exit 1`: bajo `set -e` —que es como Actions
          # ejecuta esto— una lista con && que acaba en falso puede tumbar el
          # job aunque no falte nada, y el fallo pareceria otra cosa.
          if [ "$falta" = 1 ]; then exit 1; fi

          echo "Pidiendo precios a $URL/api/precios"

          # --fail-with-body: que un 401 o un 500 rompan el job Y enseñen el
          # motivo. Con --fail a secas se pierde el cuerpo de la respuesta y no
          # se sabe si es el secreto o Supabase.
          codigo=$(curl --silent --show-error --max-time 300 \
            --write-out '%{http_code}' --output /tmp/respuesta.json \
            -H "Authorization: Bearer $SECRETO" \
            "$URL/api/precios") || true

          echo "HTTP $codigo"
          cat /tmp/respuesta.json 2>/dev/null || true
          echo

          case "$codigo" in
            200) exit 0 ;;
            401) echo "::error::401: el CRON_SECRET de GitHub no coincide con el de Vercel."; exit 1 ;;
            404) echo "::error::404: en $URL no hay ninguna ruta /api/precios. ¿Es la dirección correcta de la app y está desplegada?"; exit 1 ;;
            000) echo "::error::No se ha podido contactar con $URL. Comprueba la dirección o si el despliegue está caído."; exit 1 ;;
            *)   echo "::error::La ruta ha contestado $codigo."; exit 1 ;;
          esac
